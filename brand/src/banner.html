<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,500;0,700;0,800;1,800&display=swap">
<style>
  html,body{margin:0;width:2560px;height:1440px;overflow:hidden;background:#0E3C47;font-family:"Plus Jakarta Sans",system-ui,sans-serif}
  .bg{position:absolute;inset:0;background:
      radial-gradient(1200px 700px at 78% 50%, rgba(110,224,174,.10), transparent 60%),
      radial-gradient(900px 600px at 18% 52%, rgba(21,80,96,.9), transparent 70%), #0E3C47}
  /* decoration outside the safe area: big faint day arcs and a month strip */
  .deco{position:absolute;inset:0}
  /* safe area: 1546 x 423, centred */
  .safe{position:absolute;left:507px;top:508.5px;width:1546px;height:423px;display:flex;align-items:center;gap:56px;box-sizing:border-box;padding:0 40px}
  .mark{width:250px;height:250px;flex:none;filter:drop-shadow(0 24px 40px rgba(0,0,0,.35))}
  .txt{display:flex;flex-direction:column;gap:14px;min-width:0}
  .name{font-weight:800;font-size:132px;line-height:.95;letter-spacing:-5px;color:#EEF6F5}
  .tag{font-weight:700;font-size:47px;line-height:1.1;letter-spacing:-1.2px;color:#EEF6F5;white-space:nowrap}
  .tag em{font-style:normal;color:#6EE0AE}
  .row{display:flex;gap:18px;align-items:center;margin-top:10px}
  .pill{background:#6EE0AE;color:#0B3038;font-weight:800;font-size:30px;padding:14px 26px;border-radius:999px;letter-spacing:-.5px}
  .url{color:#A9C6CC;font-weight:600;font-size:30px}
  .guide{position:absolute;border:4px dashed #FF9877;box-sizing:border-box;display:none}
  body.guides .guide{display:block}
  .guide span{position:absolute;top:6px;left:10px;font:700 26px/1 system-ui;color:#FF9877}
</style></head><body>
<div class="bg"></div>
<svg class="deco" viewBox="0 0 2560 1440" width="2560" height="1440">
  <g opacity=".16" fill="none" stroke-linecap="round">
    <path d="M1980 1010 a420 420 0 0 1 840 0" stroke="#6EE0AE" stroke-width="40"/>
    <path d="M1880 1010 a520 520 0 0 1 1040 0" stroke="#24606F" stroke-width="18"/>
    <path d="M-380 1010 a420 420 0 0 1 840 0" stroke="#6EE0AE" stroke-width="40"/>
  </g>
  <circle cx="2400" cy="430" r="46" fill="#E8B04B" opacity=".35"/>
  <!-- month strip across the bottom: one tile per day, day 4 over, then adjusted -->
  <g transform="translate(140 1180)">
    <script></script>
  </g>
</svg>
<div class="safe">
  <svg class="mark" viewBox="0 0 96 96"><rect width="96" height="96" rx="24" fill="#155060"/>
    <path d="M18 64a30 30 0 0 1 60 0" fill="none" stroke="#24606F" stroke-width="8" stroke-linecap="round"/>
    <path d="M18 64a30 30 0 0 1 47-24.7" fill="none" stroke="#6EE0AE" stroke-width="8" stroke-linecap="round"/>
    <circle cx="65" cy="39.3" r="9" fill="#E8B04B" stroke="#155060" stroke-width="4"/>
    <path d="M14 76h68" stroke="#EEF6F5" stroke-width="6" stroke-linecap="round"/></svg>
  <div class="txt">
    <div class="name">Daysure</div>
    <div class="tag">Know what you can spend <em>today</em>. Not on the 28th.</div>
    <div class="row"><span class="pill">Join the waitlist</span><span class="url">daysure.netlify.app</span></div>
  </div>
</div>
<div class="guide" style="left:507px;top:508.5px;width:1546px;height:423px"><span>All devices (safe area)</span></div>
<div class="guide" style="left:0;top:508.5px;width:2560px;height:423px;border-color:#6EE0AE"><span style="color:#6EE0AE;left:auto;right:12px">Desktop max</span></div>
<script>
  // month strip, drawn outside the safe area only (top and bottom bands)
  const ns='http://www.w3.org/2000/svg', svg=document.querySelector('.deco');
  for (const [y,op] of [[1150,.5],[230,.25]]) for (let d=0; d<30; d++) {
    const r=document.createElementNS(ns,'rect'); const w=70, gap=12, x=(2560-(30*w+29*gap))/2 + d*(w+gap);
    r.setAttribute('x',x); r.setAttribute('y',y); r.setAttribute('width',w); r.setAttribute('height',y>1000?60:40); r.setAttribute('rx',10);
    r.setAttribute('fill', d===3 ? '#FF9877' : d<12 ? '#6EE0AE' : '#24606F'); r.setAttribute('opacity', d===3?.8:op);
    svg.appendChild(r);
  }
</script>
</body></html>
