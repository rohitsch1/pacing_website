<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>You're on the Pace waitlist</title>
<meta name="theme-color" content="#0E3C47">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Space+Grotesk:wght@700&display=swap">
<style>
  :root { --bg: #0E3C47; --fg: #EEF6F5; --muted: #A9C6CC; --mint: #6EE0AE; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg); font: 400 17px/1.6 Inter, system-ui, sans-serif; padding: 24px max(20px, env(safe-area-inset-left, 0px)); text-align: center; }
  h1 { font: 700 clamp(32px, 6vw, 48px)/1.1 "Space Grotesk", system-ui, sans-serif; letter-spacing: -0.02em; margin: 20px 0 12px; }
  p { color: var(--muted); max-width: 30em; margin: 0 auto; }
  a { display: inline-flex; margin-top: 28px; background: var(--mint); color: #0B3038; font-weight: 600; text-decoration: none; padding: 14px 24px; border-radius: 999px; }
</style>
</head>
<body>
  <main>
    <svg width="64" height="64" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="24" fill="#0B3038"/><circle cx="24" cy="24" r="13" fill="none" stroke="#24606F" stroke-width="5"/><path d="M24 11 A13 13 0 0 1 36.4 28" fill="none" stroke="#6EE0AE" stroke-width="5" stroke-linecap="round"/></svg>
    <h1>You're on the list.</h1>
    <p>We'll message you once, when Pace is ready to download on Android and iPhone. No spam, no newsletter.</p>
    <a href="/">Back to Pace</a>
  </main>
</body>
</html>
